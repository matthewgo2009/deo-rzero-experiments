$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: qwen8b-adaptive-strongctrl
experiment_name: deo-rzero-7set
description: "8B adaptive band[0.4,1.0] delta=0.1 eta_lambda=2 lambda0=10 - the working closed-loop beta controller."
compute: azureml:azureml-job-cluster
environment:
  build:
    path: ./env
    dockerfile_path: Dockerfile
code: ..
command: bash azureml/run_pipeline_job.sh ${{outputs.work}}
environment_variables:
  HF_TOKEN: __HF_TOKEN__
  OPENAI_API_KEY: __OPENAI_API_KEY__
  HUGGINGFACENAME: yuyang322
  BASE_MODEL: Qwen/Qwen3-8B-Base
  VLLM_READY_TIMEOUT: "3600"
  MODE: adaptive
  DEO_ABBR: deo_adaptive_strong
  DEO_RMIN: "0.4"
  DEO_RMAX: "1.0"
  DEO_DELTA: "0.1"
  DEO_LAMBDA0: "10"
  DEO_ETA_LAMBDA: "2.0"
resources:
  instance_type: Standard_ND96isr_H100_v5
  instance_count: 1
outputs:
  work:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/workspaceblobstore/paths/yyd_8b_adaptive_strong/
