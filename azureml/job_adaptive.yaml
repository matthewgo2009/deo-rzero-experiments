$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: deo-adaptive-temperature-7set
experiment_name: deo-rzero-7set
description: >-
  Adaptive-temperature DEO (paper §1.4): canonical MCMC walk + solver M-vote
  labeler; beta updated after each iter via GDA to keep in-band r_unc fraction
  near delta. band [0.3,0.8], delta 0.5, beta0 1.0. 5 iters + 7-set eval.
  cp-based persistence (verified) — checkpoints + beta/lambda trajectory saved.
compute: azureml:azureml-job-cluster
environment:
  build:
    path: ./env
    dockerfile_path: Dockerfile
code: ..
command: bash azureml/run_pipeline_job.sh ${{outputs.work}}
environment_variables:
  HF_TOKEN: __HF_TOKEN__
  OPENAI_API_KEY: __OPENAI_API_KEY__
  HUGGINGFACENAME: yuyang322
  MODE: adaptive
  DEO_ABBR: deo_adaptive
  DEO_RMIN: "0.3"
  DEO_RMAX: "0.8"
  DEO_DELTA: "0.5"
  DEO_BETA0: "1.0"
  DEO_LAMBDA0: "1.0"
  DEO_ETA_BETA: "0.1"
  DEO_ETA_LAMBDA: "0.1"
  DEO_NGDA: "20"
  DEO_CHUNK_SIZE: "64"
  DEO_BETA_CLAMP: "0.02,2.0"
resources:
  instance_type: Standard_ND96isr_H100_v5
  instance_count: 1
outputs:
  work:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/workspaceblobstore/paths/yyd_adaptive/
