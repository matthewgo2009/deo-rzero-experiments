$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: deo-adaptive-delta0.2
experiment_name: deo-rzero-7set
description: "Adaptive-DEO delta=0.2 violation cap (>=80% in-band target), corrected paper 1.4 formulation, 4B."
compute: azureml:azureml-job-cluster
environment:
  build:
    path: ./env
    dockerfile_path: Dockerfile
code: ..
command: bash azureml/run_pipeline_job.sh ${{outputs.work}}
environment_variables:
  HF_TOKEN: __HF_TOKEN__
  OPENAI_API_KEY: __OPENAI_API_KEY__
  HUGGINGFACENAME: yuyang322
  VLLM_READY_TIMEOUT: "1800"
  MODE: adaptive
  DEO_ABBR: deo_adaptive_d02
  DEO_DELTA: "0.2"
resources:
  instance_type: Standard_ND96isr_H100_v5
  instance_count: 1
outputs:
  work:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/workspaceblobstore/paths/yyd_adaptive_d02/
