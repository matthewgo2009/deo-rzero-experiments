$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: deo-canon-claude-smoke-1iter
experiment_name: deo-rzero-7set
description: >-
  Canonical DEO (MCMC walk) + Claude Sonnet 4.5 labeler — 1-iter smoke to verify
  Claude labeling coverage (~full, not the 41% a small max_tokens gave) before
  the full 5-iter run.
compute: azureml:azureml-job-cluster
environment:
  build:
    path: ./env
    dockerfile_path: Dockerfile
code: ..
command: bash azureml/run_pipeline_job.sh ${{outputs.work}}
environment_variables:
  HF_TOKEN: __HF_TOKEN__
  OPENAI_API_KEY: __OPENAI_API_KEY__
  ANTHROPIC_API_KEY: __ANTHROPIC_KEY__
  HUGGINGFACENAME: yuyang322
  MODE: canon_claude_smoke
resources:
  instance_type: Standard_ND96isr_H100_v5
  instance_count: 1
outputs:
  work:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/workspaceblobstore/paths/yyd_canon_claude_smoke/
