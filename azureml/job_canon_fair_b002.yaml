$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: deo-canon-fair-beta0.02-lamrep2
experiment_name: deo-rzero-7set
description: >-
  DEO canonical (MCMC walk) + solver labeler, fixed beta=0.02 and LAMBDA_REP=2 —
  the reward-scale-corrected fair analog of R-Zero's challenger objective
  (r_c^DEO = 2*(min(p,1-p)-penalty), kl_coef 0.01 -> DEO beta 0.02). 5 iters + 7-set.
compute: azureml:azureml-job-cluster
environment:
  build:
    path: ./env
    dockerfile_path: Dockerfile
code: ..
command: bash azureml/run_pipeline_job.sh ${{outputs.work}}
environment_variables:
  HF_TOKEN: __HF_TOKEN__
  OPENAI_API_KEY: __OPENAI_API_KEY__
  HUGGINGFACENAME: yuyang322
  MODE: curriculum
  DEO_ABBR: deo_canon_fair_b002
  DEO_BETA_SCHEDULE: "0.02,0.02,0.02,0.02,0.02"
  DEO_LAMBDA_REP: "2"
resources:
  instance_type: Standard_ND96isr_H100_v5
  instance_count: 1
outputs:
  work:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/workspaceblobstore/paths/yyd_canon_fair_b002/
