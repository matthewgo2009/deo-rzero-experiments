$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: deo-cd-strong-klprev-4b
experiment_name: deo-rzero-7set
description: "4B DEO full-stack: CD U-statistic acceptance + strong-control beta (band[0.4,1.0],delta=0.1) + KL anchored to prev-iter solver + 2000 q/iter."
compute: azureml:azureml-job-cluster
environment:
  build:
    path: ./env
    dockerfile_path: Dockerfile
code: ..
command: bash azureml/run_pipeline_job.sh ${{outputs.work}}
environment_variables:
  HF_TOKEN: __HF_TOKEN__
  OPENAI_API_KEY: __OPENAI_API_KEY__
  ANTHROPIC_API_KEY: __ANTHROPIC_KEY__
  HUGGINGFACENAME: yuyang322
  BASE_MODEL: Qwen/Qwen3-4B-Base
  VLLM_READY_TIMEOUT: "1800"
  MODE: adaptive
  DEO_ABBR: deo_cd_strong
  DEO_TOTAL_Q: "2000"
  DEO_CD_ACCEPT: "1"
  DEO_USTAT_N: "12"
  DEO_KL_REF: prev
  DEO_RMIN: "0.4"
  DEO_RMAX: "1.0"
  DEO_DELTA: "0.1"
  DEO_LAMBDA0: "10"
  DEO_ETA_LAMBDA: "2.0"
resources:
  instance_type: Standard_ND96isr_H100_v5
  instance_count: 1
outputs:
  work:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/workspaceblobstore/paths/yyd_cd_strong_4b/
