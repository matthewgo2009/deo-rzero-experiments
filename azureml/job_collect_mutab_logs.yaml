$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: collect-mutab-logs
experiment_name: deo-rzero-7set
description: "Copy MCMC walk logs + pool/filtered datasets from mutation A/B arms for per-proposal export."
compute: azureml:azureml-job-cpu-cluster
environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu20.04:latest
code: ..
command: bash azureml/collect_mutab_logs.sh ${{outputs.out}} ${{inputs.v1}} ${{inputs.v2}}
inputs:
  v1:
    type: uri_folder
    mode: ro_mount
    path: azureml://datastores/workspaceblobstore/paths/yyd_mutv1_fb_4b/
  v2:
    type: uri_folder
    mode: ro_mount
    path: azureml://datastores/workspaceblobstore/paths/yyd_mutv2_fb_4b/
outputs:
  out:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/workspaceblobstore/paths/yyd_collect_mutab_logs/
resources:
  instance_type: Standard_D32_v3
  instance_count: 1
