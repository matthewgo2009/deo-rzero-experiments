$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: collect-wm-4b
experiment_name: deo-rzero-7set
description: "Copy cool_fig (4B weakness-memory walk) weakness notes + global memories + pools + filtered sets."
compute: azureml:azureml-job-cpu-cluster
environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu20.04:latest
code: ..
command: bash azureml/collect_wm_4b.sh ${{outputs.out}} ${{inputs.src}}
inputs:
  src:
    type: uri_folder
    mode: ro_mount
    path: azureml://datastores/workspaceblobstore/paths/yyd_wm_fb_4b/
outputs:
  out:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/workspaceblobstore/paths/yyd_collect_wm_4b/
resources:
  instance_type: Standard_D32_v3
  instance_count: 1
