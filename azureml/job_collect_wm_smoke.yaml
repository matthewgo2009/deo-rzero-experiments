$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: collect-wm-smoke
experiment_name: deo-rzero-7set
description: "Copy sweet_melon v2.1 smoke artifacts (events, notes, report)."
compute: azureml:azureml-job-cpu-cluster
environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu20.04:latest
code: ..
command: bash azureml/collect_wm_smoke.sh ${{outputs.out}} ${{inputs.src}}
inputs:
  src:
    type: uri_folder
    mode: ro_mount
    path: azureml://datastores/workspaceblobstore/paths/yyd_wm_smoke_4b/
outputs:
  out:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/workspaceblobstore/paths/yyd_collect_wm_smoke/
resources:
  instance_type: Standard_D32_v3
  instance_count: 1
