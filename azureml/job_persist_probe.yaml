$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: persist-probe-3gb
experiment_name: deo-rzero-7set
description: Minimal probe — verify a 3GB fake checkpoint + eval json persist to OUT on clean completion.
compute: azureml:azureml-job-cluster
environment:
  build:
    path: ./env
    dockerfile_path: Dockerfile
code: ..
command: bash azureml/persist_probe.sh ${{outputs.work}}
environment_variables:
  HF_TOKEN: __HF_TOKEN__
  OPENAI_API_KEY: __OPENAI_API_KEY__
resources:
  instance_type: Standard_ND96isr_H100_v5
  instance_count: 1
outputs:
  work:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/workspaceblobstore/paths/yyd_persist_probe/
