$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: rzero-regrade-dual-grader-7set
experiment_name: deo-rzero-7set
description: >-
  Regrade the completed 8-GPU R-Zero run: fresh 7-set generation (raw math_verify)
  on the persisted solver_v1..v5 checkpoints, then DUAL grading — ours (gpt-4o-mini
  boxed) vs paper (gpt-4o full-text). Mounts yyd_rzero_full8; reads checkpoints
  straight from the mount (no local restore). Answers whether R-Zero reaches ~49
  MATH AVG under the paper's lenient grader.
compute: azureml:azureml-job-cluster
environment:
  build:
    path: ./env
    dockerfile_path: Dockerfile
code: ..
command: bash azureml/run_pipeline_job.sh ${{outputs.work}}
environment_variables:
  HF_TOKEN: __HF_TOKEN__
  OPENAI_API_KEY: __OPENAI_API_KEY__
  HUGGINGFACENAME: yuyang322
  MODE: regrade
resources:
  instance_type: Standard_ND96isr_H100_v5
  instance_count: 1
outputs:
  work:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/workspaceblobstore/paths/yyd_rzero_full8/
