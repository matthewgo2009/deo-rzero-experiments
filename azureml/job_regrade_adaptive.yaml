$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: deo-adaptive-regrade-dual-grader
experiment_name: deo-rzero-7set
description: >-
  Regrade adaptive-DEO: fresh 7-set gen on persisted deo_adaptive checkpoints +
  dual grader (ours gpt-4o-mini boxed | paper gpt-4o full-text).
compute: azureml:azureml-job-cluster
environment:
  build:
    path: ./env
    dockerfile_path: Dockerfile
code: ..
command: bash azureml/run_pipeline_job.sh ${{outputs.work}}
environment_variables:
  HF_TOKEN: __HF_TOKEN__
  OPENAI_API_KEY: __OPENAI_API_KEY__
  HUGGINGFACENAME: yuyang322
  MODE: regrade
  REGRADE_CKSUB: DEO
  REGRADE_ABBR: deo_adaptive
resources:
  instance_type: Standard_ND96isr_H100_v5
  instance_count: 1
outputs:
  work:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/workspaceblobstore/paths/yyd_adaptive/
