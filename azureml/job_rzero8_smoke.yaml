$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: rzero-8gpu-stock-smoke-1iter
experiment_name: deo-rzero-7set
description: >-
  Full study: DEO baseline_drift (no MCMC walk + drifting labeler) 5 iters,
  R-Zero penalty-questioner 5 iters, then evaluate base + both ladders on the 7
  R-Zero math benchmarks (math gsm8k amc minerva olympiad aime2024 aime2025) with
  gpt-4o-mini boxed-only recheck. Idempotent/resumable via the fixed output path.
compute: azureml:azureml-job-cluster
environment:
  build:
    path: ./env
    dockerfile_path: Dockerfile
code: ..
command: bash azureml/run_pipeline_job.sh ${{outputs.work}}
environment_variables:
  HF_TOKEN: __HF_TOKEN__
  OPENAI_API_KEY: __OPENAI_API_KEY__
  HUGGINGFACENAME: yuyang322
  MODE: rzero_smoke
resources:
  instance_type: Standard_ND96isr_H100_v5
  instance_count: 1
outputs:
  work:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/workspaceblobstore/paths/yyd_rzero8_smoke/
