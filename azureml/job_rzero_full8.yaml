$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: rzero-full-8gpu64-5iter
experiment_name: deo-rzero-7set
description: >-
  R-Zero 4-GPU/64 proven config, 5 iters + 7-set eval. cp-based persistence (verified),
  startup self-test, per-iter wallclock. Produces checkpoints + per-problem responses on
  OUT for offline re-grade with the paper's gpt-4o grader. DO NOT cancel (let it complete).
compute: azureml:azureml-job-cluster
environment:
  build:
    path: ./env
    dockerfile_path: Dockerfile
code: ..
command: bash azureml/run_pipeline_job.sh ${{outputs.work}}
environment_variables:
  HF_TOKEN: __HF_TOKEN__
  OPENAI_API_KEY: __OPENAI_API_KEY__
  HUGGINGFACENAME: yuyang322
  MODE: rzero_eval
resources:
  instance_type: Standard_ND96isr_H100_v5
  instance_count: 1
outputs:
  work:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/workspaceblobstore/paths/yyd_rzero_full8/
