$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: rzero-persist-smoke-2iter-1step
experiment_name: deo-rzero-7set
description: >-
  Persistence smoke: R-Zero 2 iters, ~1 saved train step each (max_steps=2,
  save_freq=1 -> global_step_1), tiny gen pool. Verifies checkpoints + eval
  responses actually persist to OUT (cp fix + startup self-test) before the full run.
compute: azureml:azureml-job-cluster
environment:
  build:
    path: ./env
    dockerfile_path: Dockerfile
code: ..
command: bash azureml/run_pipeline_job.sh ${{outputs.work}}
environment_variables:
  HF_TOKEN: __HF_TOKEN__
  OPENAI_API_KEY: __OPENAI_API_KEY__
  HUGGINGFACENAME: yuyang322
  MODE: rzero_eval
  RZERO_ITERS: "2"
  RZ_Q_MAXSTEPS: "2"
  RZ_Q_SAVEFREQ: "1"
  RZ_Q_GSTEP: "1"
  RZ_S_MAXSTEPS: "2"
  RZ_S_SAVEFREQ: "1"
  RZ_S_GSTEP: "1"
  RZ_NUM_SAMPLES: "100"
  RZ_S_ROLLOUT: "16"
  RZ_Q_ROLLOUT: "32"
resources:
  instance_type: Standard_ND96isr_H100_v5
  instance_count: 1
outputs:
  work:
    type: uri_folder
    mode: rw_mount
    path: azureml://datastores/workspaceblobstore/paths/yyd_rzero_persisttest/
