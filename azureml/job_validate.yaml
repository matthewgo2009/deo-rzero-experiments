$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: deo-baseline-drift-validate-iter1
experiment_name: deo-rzero-7set
description: >-
  DEO baseline_drift (no MCMC walk + drifting labeler) — single real iteration,
  end-to-end native validation (native vLLM, MCMC, HF push, verl GRPO w/ KL-pin,
  global_step_15 merge, MATH-500 + gpt-mini recheck) before the full multi-day run.
compute: azureml:azureml-job-cluster
environment:
  build:
    path: ./env
    dockerfile_path: Dockerfile
code: ..
command: bash azureml/run_validate.sh ${{outputs.work}}
environment_variables:
  HF_TOKEN: __HF_TOKEN__
  OPENAI_API_KEY: __OPENAI_API_KEY__
  HUGGINGFACENAME: yuyang322
resources:
  instance_type: Standard_ND96isr_H100_v5
  instance_count: 1
outputs:
  work:
    type: uri_folder
    mode: rw_mount
